<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disk Map</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --line: #e4e4e0; --text: #1d1d1b; --muted: #6f6f6a;
  --chip: #f0f0ec; --accent: #111; --accent-text: #fff;
  --safe: #2f9e5b; --safe-bg: #e3f4ea; --review: #c77a12; --review-bg: #fbefd9;
  --mine: #2b6fd6; --mine-bg: #e2ecfb;
  --tile-l: 94%; --tile-s: 70%; --edge-l: 72%; --edge-s: 45%; --neutral: #ececea; --neutral-edge: #cfcfca;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --panel: #1d1d1b; --line: #33332f; --text: #ececea; --muted: #9a9a94;
    --chip: #2a2a27; --accent: #ececea; --accent-text: #111;
    --safe: #5cc787; --safe-bg: #1d3427; --review: #e6a54a; --review-bg: #3a2c16;
    --mine: #6ea2f0; --mine-bg: #1c2a42;
    --tile-l: 22%; --tile-s: 28%; --edge-l: 40%; --edge-s: 30%; --neutral: #262624; --neutral-edge: #3e3e3a;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --panel: #1d1d1b; --line: #33332f; --text: #ececea; --muted: #9a9a94;
  --chip: #2a2a27; --accent: #ececea; --accent-text: #111;
  --safe: #5cc787; --safe-bg: #1d3427; --review: #e6a54a; --review-bg: #3a2c16;
  --mine: #6ea2f0; --mine-bg: #1c2a42;
  --tile-l: 22%; --tile-s: 28%; --edge-l: 40%; --edge-s: 30%; --neutral: #262624; --neutral-edge: #3e3e3a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 16px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
header h1 { font-size: 18px; margin: 0; }
header .sub { color: var(--muted); font-size: 13px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
.card { padding: 14px 18px; border-left: 1px solid var(--line); min-width: 0; }
.card:first-child { border-left: 0; }
.card .k { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.card .v { font-family: var(--mono); font-size: 26px; font-weight: 600; margin-top: 4px; white-space: nowrap; }
.card .v small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.card .v small.up { color: var(--safe); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.panel-head { padding: 14px 16px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.panel-head h2 { font-size: 15px; margin: 0; }
.panel-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 6px; cursor: pointer; }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.crumbs { display: flex; justify-content: space-between; gap: 8px; padding: 6px 16px 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.crumbs a { color: var(--muted); text-decoration: none; cursor: pointer; }
.crumbs a:hover { color: var(--text); text-decoration: underline; }
.crumbs .here { color: var(--text); font-weight: 600; }
#map { position: relative; height: max(480px, calc(100vh - 300px)); margin: 0 12px; }
.tile { position: absolute; border-radius: 6px; border: 1px solid hsl(var(--h) var(--edge-s) var(--edge-l)); background: hsl(var(--h) var(--tile-s) var(--tile-l)); overflow: hidden; cursor: pointer; transition: filter .1s; }
.tile:hover { filter: brightness(0.97) saturate(1.1); }
.tile.gray { --tile-s: 0%; --edge-s: 0%; }
.tile.rest { background: var(--neutral); border-color: var(--neutral-edge); border-style: dashed; cursor: default; }
.mode-cleanup .tile:not(.cand) { --tile-s: 0% !important; --edge-s: 0% !important; }
.tile.cand { background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--tc) 45%, transparent) 0 1.5px, transparent 1.5px 8px); border-color: var(--tc); }
.tile.cand.sel { background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--tc) 75%, transparent) 0 2px, transparent 2px 7px); border-width: 2px; }
.mode-cleanup .tile.cand { background-color: var(--tbg); }
.tile.flash { outline: 3px solid var(--accent); outline-offset: 1px; z-index: 5; }
.tile .lbl { position: absolute; left: 8px; top: 5px; right: 8px; display: flex; justify-content: space-between; gap: 6px; font-size: 12.5px; white-space: nowrap; pointer-events: none; }
.tile .lbl .nm { overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.tile.cand .lbl span, .tile.cand .big { background: var(--panel); border-radius: 4px; padding: 0 4px; }
.tile .lbl .sz { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.tile .big { position: absolute; left: 8px; bottom: 6px; font-family: var(--mono); font-weight: 600; pointer-events: none; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 16px 14px; color: var(--muted); font-size: 12.5px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.hatch-sw { background-image: repeating-linear-gradient(135deg, var(--safe) 0 1.5px, transparent 1.5px 4px); border: 1px solid var(--safe); }
#tip { position: fixed; pointer-events: none; z-index: 20; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.15); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; max-width: 420px; display: none; }
#tip .p { font-family: var(--mono); font-size: 11.5px; color: var(--muted); word-break: break-all; }
#tip .t { margin-top: 4px; }

.recs { display: flex; flex-direction: column; max-height: calc(100vh - 140px); position: sticky; top: 16px; }
.recs .list { overflow: auto; flex: 1; border-top: 1px solid var(--line); }
.sec { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 6px; position: sticky; top: 0; background: var(--panel); z-index: 1; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; font-weight: 500; }
.b-mine { color: var(--mine); background: var(--mine-bg); }
.b-safe { color: var(--safe); background: var(--safe-bg); }
.b-review { color: var(--review); background: var(--review-bg); }
.sec .num { color: var(--muted); font-size: 13px; }
.group { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 18px; gap: 10px; align-items: center; padding: 10px 16px; cursor: pointer; }
.row:hover { background: var(--chip); }
.row input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.row .title { font-weight: 500; }
.row .meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .size { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
.row .chev { color: var(--muted); transition: transform .15s; }
.group.open .chev { transform: rotate(90deg); }
.items { display: none; padding: 0 16px 10px 48px; }
.group.open .items { display: block; }
.items .note { color: var(--muted); font-size: 12.5px; margin: 0 0 6px; }
.items .note code { font-family: var(--mono); font-size: 11.5px; background: var(--chip); padding: 1px 4px; border-radius: 4px; }
.item { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 3px 0; font-size: 12.5px; }
.item input { margin: 0; accent-color: var(--accent); }
.item .p { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.item .s { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.item button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0 2px; }
.item button:hover { color: var(--text); }
.foot { border-top: 1px solid var(--line); padding: 12px 16px; }
.foot .sum { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.foot .sum b { color: var(--text); font-family: var(--mono); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
.btn:hover { background: var(--chip); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
#scriptBox { display: none; margin-top: 10px; }
#scriptBox pre { max-height: 220px; overflow: auto; background: var(--chip); border-radius: 8px; padding: 10px; font-size: 11.5px; margin: 0; font-family: var(--mono); white-space: pre; }
.empty { padding: 20px 16px; color: var(--muted); }
@media (max-width: 1000px) {
  .main { grid-template-columns: 1fr; }
  .recs { position: static; max-height: none; }
  .cards { grid-template-columns: repeat(2, 1fr); }
  .card:nth-child(3) { border-left: 0; }
  .card:nth-child(n+3) { border-top: 1px solid var(--line); }
  #map { height: 70vh; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Disk Map</h1>
    <span class="sub" id="sub"></span>
  </header>
  <section class="cards" id="cards"></section>
  <div class="main">
    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>Explorer</h2>
          <p>Sized by space used. Click a tile to open it. Striped tiles are cleanup suggestions.</p>
        </div>
        <div class="seg" id="mode">
          <button data-m="category" class="on">Category</button>
          <button data-m="cleanup">Cleanup</button>
        </div>
      </div>
      <div class="crumbs"><div id="crumbs"></div><div class="num" id="crumbSize"></div></div>
      <div id="map"></div>
      <div class="legend" id="legend"></div>
    </section>
    <aside class="panel recs">
      <div class="panel-head">
        <div>
          <h2>Recommendations</h2>
          <p>Select items to build a cleanup script</p>
        </div>
      </div>
      <div class="list" id="recs"></div>
      <div class="foot">
        <div class="sum" id="selSum"></div>
        <div class="btns">
          <button class="btn" id="selSafe">Select suggested</button>
          <button class="btn" id="selNone">Clear</button>
          <button class="btn" id="preview">Preview</button>
          <button class="btn" id="download">Download .sh</button>
          <button class="btn primary" id="copy">Copy script</button>
        </div>
        <div id="scriptBox"><pre id="scriptPre"></pre></div>
      </div>
    </aside>
  </div>
</div>
<div id="tip"></div>
<script>
const DATA = /*__DATA__*/null;
const HOME = DATA.meta.home;
const HUES = { "Package caches": 222, "AI models": 330, "iOS & Android SDKs": 192, "Code projects": 258,
  "Documents & media": 24, "Applications": 48, "Dev tools & other": 0, "System": 0, "Other": 0 };
const GRAY = new Set(["Dev tools & other", "System", "Other"]);
const TIERS = {
  mine:   { name: "Your list",      cls: "b-mine",   v: "--mine" },
  safe:   { name: "Safe to remove", cls: "b-safe",   v: "--safe" },
  review: { name: "Review first",   cls: "b-review", v: "--review" },
};

// ---------- helpers
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function fmt(b) {
  const g = b / 1024 ** 3;
  if (g >= 100) return g.toFixed(0) + " GB";
  if (g >= 1) return g.toFixed(1) + " GB";
  const m = b / 1024 ** 2;
  return (m >= 10 ? m.toFixed(0) : m.toFixed(1)) + " MB";
}
const tilde = (p) => p === HOME ? "~" : p.startsWith(HOME + "/") ? "~" + p.slice(HOME.length) : p;
const join = (parent, name) => parent === "/" ? "/" + name : parent + "/" + name;
const shq = (s) => "'" + s.replace(/'/g, "'\\''") + "'";

// ---------- tree
const byPath = new Map();
(function index(node, path, parent, cat) {
  node.path = path; node.parent = parent; node.cat = node.c ?? cat;
  byPath.set(path, node);
  for (const k of node.k || []) index(k, join(path, k.n), node, node.cat);
})(DATA.tree, "/", null, DATA.tree.c);

// ---------- candidates & selection
const rules = DATA.rules;
const cands = DATA.candidates.map(([path, size, r, whole], i) => ({ i, path, size, r, whole, rule: rules[r] }));
const candByPath = new Map(cands.map((c) => [c.path, c]));
const groups = new Map();
for (const c of cands) {
  if (!groups.has(c.r)) groups.set(c.r, { r: c.r, rule: rules[c.r], items: [], size: 0 });
  const g = groups.get(c.r); g.items.push(c); g.size += c.size;
}
const defaultSel = () => new Set(cands.filter((c) => c.rule.tier !== "review").map((c) => c.i));
let selected = defaultSel();
try {
  const saved = JSON.parse(localStorage.getItem("diskmap-sel-" + DATA.meta.generated_at) || "null");
  if (Array.isArray(saved)) selected = new Set(saved.filter((i) => i < cands.length));
} catch {}
function saveSel() { try { localStorage.setItem("diskmap-sel-" + DATA.meta.generated_at, JSON.stringify([...selected])); } catch {} }
const sumOf = (list) => list.reduce((a, c) => a + c.size, 0);
const selSize = () => sumOf(cands.filter((c) => selected.has(c.i)));

// ---------- header + cards
(function header() {
  const m = DATA.meta;
  const d = m.scanned_at ? new Date(m.scanned_at * 1000).toLocaleString() : "unknown";
  $("#sub").textContent = `${m.host} · scanned ${d} · ${fmt(DATA.tree.s)} on disk`;
})();
function renderCards() {
  const t = (tier) => cands.filter((c) => c.rule.tier === tier);
  const mine = t("mine"), safe = t("safe"), review = t("review");
  const disk = DATA.meta.disk, sel = selSize();
  const card = (label, dot, value, small, up) =>
    `<div class="card"><div class="k">${dot ? `<span class="dot" style="background:var(${dot})"></span>` : ""}${label}</div>` +
    `<div class="v">${value}${small ? `<small class="${up ? "up" : ""}">${small}</small>` : ""}</div></div>`;
  $("#cards").innerHTML =
    (disk ? card("Free after cleanup", null, fmt(disk.free + sel), "+" + fmt(sel), true)
          : card("Selected to free", null, fmt(sel), `${selected.size} items`)) +
    card("Your list + safe", "--safe", fmt(sumOf(mine) + sumOf(safe)), `${mine.length + safe.length} items`) +
    card("Needs review", "--review", fmt(sumOf(review)), `${review.length} items`) +
    card("Scanned", null, fmt(DATA.tree.s), disk ? `of ${fmt(disk.total)} disk` : "");
}

// ---------- treemap
let current = byPath.get(HOME) || DATA.tree;
let mode = "category";
function worst(row, sum, side) {
  let mx = 0, mn = Infinity;
  for (const r of row) { if (r.v > mx) mx = r.v; if (r.v < mn) mn = r.v; }
  const s2 = sum * sum, w2 = side * side;
  return Math.max((w2 * mx) / s2, s2 / (w2 * mn));
}
function squarify(items, x, y, w, h) {
  const out = []; let i = 0;
  while (i < items.length && w > 0.5 && h > 0.5) {
    const side = Math.min(w, h);
    let row = [items[i]], sum = items[i].v, wr = worst(row, sum, side), j = i + 1;
    while (j < items.length) {
      const next = [...row, items[j]], s2 = sum + items[j].v, w2 = worst(next, s2, side);
      if (w2 > wr) break;
      row = next; sum = s2; wr = w2; j++;
    }
    if (w >= h) {
      const cw = sum / h; let cy = y;
      for (const it of row) { const ch = it.v / cw; out.push({ it, x, y: cy, w: cw, h: ch }); cy += ch; }
      x += cw; w -= cw;
    } else {
      const rh = sum / w; let cx = x;
      for (const it of row) { const cw = it.v / rh; out.push({ it, x: cx, y, w: cw, h: rh }); cx += cw; }
      y += rh; h -= rh;
    }
    i = j;
  }
  return out;
}
function candOf(node) { // the candidate covering this node, if any
  for (let n = node; n; n = n.parent) { const c = candByPath.get(n.path); if (c) return c; }
  return null;
}
function layout(node, x, y, w, h, depth, frag) {
  const kids = (node.k || []).filter((k) => k.s > 0);
  const area = w * h, total = node.s || 1;
  const items = kids.map((k) => ({ node: k, v: (k.s / total) * area }));
  const rest = node.s - kids.reduce((a, k) => a + k.s, 0);
  if (rest / total > 0.01) items.push({ rest, v: (rest / total) * area });
  items.sort((a, b) => b.v - a.v);
  for (const r of squarify(items.filter((it) => it.v > 0), x, y, w, h)) {
    const g = 2, tx = r.x + g / 2, ty = r.y + g / 2, tw = r.w - g, th = r.h - g;
    if (tw < 3 || th < 3) continue;
    const t = el("div", "tile");
    t.style.cssText = `left:${tx}px;top:${ty}px;width:${tw}px;height:${th}px`;
    if (r.it.rest != null) {
      t.classList.add("rest");
      t.dataset.rest = r.it.rest;
      if (tw > 90 && th > 34) t.append(lbl("small files", fmt(r.it.rest)));
      frag.append(t); continue;
    }
    const n = r.it.node, cat = DATA.categories[n.cat];
    t.style.setProperty("--h", HUES[cat] ?? 0);
    if (GRAY.has(cat)) t.classList.add("gray");
    const c = candOf(n);
    if (c) {
      const v = TIERS[c.rule.tier].v;
      t.classList.add("cand");
      if (selected.has(c.i)) t.classList.add("sel");
      t.style.setProperty("--tc", `var(${v})`);
      t.style.setProperty("--tbg", `var(${v}-bg)`);
    }
    t.dataset.path = n.path;
    frag.append(t);
    const nest = depth < 2 && n.k && tw > 110 && th > 70;
    if (nest) {
      t.append(lbl(n.n, fmt(n.s)));
      layout(n, tx + 4, ty + 24, tw - 8, th - 28, depth + 1, frag);
    } else {
      if (tw > 46 && th > 22) t.append(lbl(n.n, tw > 120 && th > 60 ? "" : fmt(n.s)));
      if (tw > 120 && th > 60) {
        const b = el("div", "big", fmt(n.s));
        b.style.fontSize = (tw > 220 && th > 140 ? 22 : tw > 160 ? 17 : 14) + "px";
        t.append(b);
      }
    }
  }
}
function lbl(name, size) {
  const d = el("div", "lbl");
  d.append(el("span", "nm", name));
  if (size) d.append(el("span", "sz", size));
  return d;
}
function renderMap() {
  const map = $("#map");
  map.className = mode === "cleanup" ? "mode-cleanup" : "";
  const frag = document.createDocumentFragment();
  layout(current, 0, 0, map.clientWidth, map.clientHeight, 0, frag);
  map.replaceChildren(frag);
  renderCrumbs();
}
function renderCrumbs() {
  const chain = [];
  for (let n = current; n; n = n.parent) chain.unshift(n);
  const box = $("#crumbs"); box.replaceChildren();
  chain.forEach((n, idx) => {
    if (idx) box.append(" / ");
    const label = n.path === "/" ? "Disk" : n.path === HOME ? "~ Home" : n.n;
    if (n === current) box.append(el("span", "here", label));
    else { const a = el("a", null, label); a.onclick = () => go(n); box.append(a); }
  });
  $("#crumbSize").textContent = fmt(current.s);
}
function go(node) { current = node; renderMap(); }
function locate(path) {
  let n = byPath.get(path), p = path;
  while (!n && p.includes("/")) { p = p.slice(0, p.lastIndexOf("/")) || "/"; n = byPath.get(p); }
  if (!n) return;
  go(n.parent || n);
  const t = [...document.querySelectorAll("#map .tile")].find((x) => x.dataset.path === n.path);
  if (t) { t.classList.add("flash"); t.scrollIntoView({ block: "nearest" }); setTimeout(() => t.classList.remove("flash"), 1600); }
}
$("#map").addEventListener("click", (e) => {
  const t = e.target.closest(".tile"); if (!t || !t.dataset.path) return;
  const n = byPath.get(t.dataset.path);
  if (n && n.k) go(n);
  else { const c = candOf(n); if (c) openGroup(c.r, c.i); }
});
const tip = $("#tip");
$("#map").addEventListener("mousemove", (e) => {
  const t = e.target.closest(".tile");
  if (!t) { tip.style.display = "none"; return; }
  if (t.dataset.rest) { tip.innerHTML = `<b>Small files &amp; folders</b> · ${fmt(+t.dataset.rest)}`; }
  else {
    const n = byPath.get(t.dataset.path), c = candOf(n);
    tip.innerHTML = "";
    const head = el("div"); head.append(el("b", null, n.n), ` · ${fmt(n.s)} · ${DATA.categories[n.cat]}`);
    tip.append(head, el("div", "p", tilde(n.path)));
    if (c) tip.append(el("div", "t", `${TIERS[c.rule.tier].name}: ${c.rule.label}${c.rule.note ? " — " + c.rule.note : ""}`));
  }
  tip.style.display = "block";
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
  const y = e.clientY + 16 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
$("#map").addEventListener("mouseleave", () => (tip.style.display = "none"));
$("#mode").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.m;
  for (const x of $("#mode").children) x.classList.toggle("on", x === b);
  renderMap();
});
let resizeT; addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(renderMap, 120); });

function renderLegend() {
  const used = new Set(); for (const n of byPath.values()) used.add(n.cat);
  const lg = $("#legend"); lg.replaceChildren();
  DATA.categories.forEach((name, i) => {
    if (!used.has(i)) return;
    const s = el("span"), sw = el("i");
    const sat = GRAY.has(name) ? 0 : 65;
    sw.style.background = `hsl(${HUES[name] ?? 0} ${sat}% 60%)`;
    s.append(sw, name); lg.append(s);
  });
  const s = el("span"), sw = el("i", "hatch-sw"); s.append(sw, "Suggested cleanup"); lg.append(s);
}

// ---------- recommendations
const openGroups = new Set();
function renderRecs() {
  const list = $("#recs"); list.replaceChildren();
  if (!cands.length) { list.append(el("div", "empty", "No cleanup suggestions matched. Add paths to my_cleanup_rules.toml.")); return; }
  for (const tier of ["mine", "safe", "review"]) {
    const gs = [...groups.values()].filter((g) => g.rule.tier === tier).sort((a, b) => b.size - a.size);
    if (!gs.length) continue;
    const sec = el("div", "sec");
    sec.append(el("span", "badge " + TIERS[tier].cls, TIERS[tier].name), el("span", "num", fmt(gs.reduce((a, g) => a + g.size, 0))));
    list.append(sec);
    for (const g of gs) list.append(groupEl(g));
  }
}
function patternText(g) {
  if (g.items.length === 1) return tilde(g.items[0].path);
  return `${g.items.length} folders · ` + g.rule.paths.map((p) => p.replace(HOME, "~")).join(", ");
}
function groupEl(g) {
  const box = el("div", "group" + (openGroups.has(g.r) ? " open" : ""));
  box.dataset.r = g.r;
  const row = el("div", "row");
  const cb = el("input"); cb.type = "checkbox";
  const nSel = g.items.filter((c) => selected.has(c.i)).length;
  cb.checked = nSel === g.items.length; cb.indeterminate = nSel > 0 && nSel < g.items.length;
  cb.onclick = (e) => { e.stopPropagation(); for (const c of g.items) cb.checked ? selected.add(c.i) : selected.delete(c.i); changed(); };
  const mid = el("div"); mid.style.minWidth = "0";
  mid.append(el("div", "title", g.rule.label), el("div", "meta", patternText(g)));
  row.append(cb, mid, el("div", "size", fmt(g.size)), el("div", "chev", "›"));
  row.onclick = () => { openGroups.has(g.r) ? openGroups.delete(g.r) : openGroups.add(g.r); box.classList.toggle("open"); };
  const items = el("div", "items");
  const note = [g.rule.note, g.rule.command ? `runs <code>${g.rule.command.replace(/</g, "&lt;")}</code>` : ""].filter(Boolean).join(" · ");
  if (note) { const p = el("p", "note"); p.innerHTML = note; items.append(p); }
  for (const c of g.items.slice(0, 300)) {
    const it = el("div", "item"); it.dataset.i = c.i;
    const icb = el("input"); icb.type = "checkbox"; icb.checked = selected.has(c.i);
    icb.onchange = () => { icb.checked ? selected.add(c.i) : selected.delete(c.i); changed(); };
    const p = el("span", "p"); p.textContent = "‎" + tilde(c.path); p.title = c.path;
    const b = el("button", null, "map"); b.title = "Show on map"; b.onclick = () => locate(c.path);
    it.append(icb, p, el("span", "s", fmt(c.size)), b);
    items.append(it);
  }
  if (g.items.length > 300) items.append(el("p", "note", `…and ${g.items.length - 300} more (toggled with the group checkbox)`));
  box.append(row, items);
  return box;
}
function openGroup(r, i) {
  openGroups.add(r); renderRecs();
  const g = document.querySelector(`.group[data-r="${r}"]`);
  const it = g && g.querySelector(`.item[data-i="${i}"]`);
  (it || g)?.scrollIntoView({ block: "center", behavior: "smooth" });
}
function changed() { saveSel(); renderRecs(); renderCards(); renderFoot(); renderMap(); }
function renderFoot() {
  $("#selSum").innerHTML = `<b>${fmt(selSize())}</b> selected · ${selected.size} items`;
  if ($("#scriptBox").style.display === "block") $("#scriptPre").textContent = buildScript();
}

// ---------- script
function buildScript() {
  const lines = ["#!/bin/sh", "# Generated by Disk Map. Review every line before running:", "# this permanently deletes data.", "set -u"];
  for (const tier of ["mine", "safe", "review"]) {
    const gs = [...groups.values()].filter((g) => g.rule.tier === tier).sort((a, b) => b.size - a.size);
    for (const g of gs) {
      const items = g.items.filter((c) => selected.has(c.i));
      if (!items.length) continue;
      lines.push("", `# ${g.rule.label} [${tier}] - ${fmt(sumOf(items))}`);
      // a command cleans the whole matched folder; split-off pieces use rm instead
      const cmd = g.rule.command, perPath = cmd && (cmd.includes("{path}") || cmd.includes("{parent}"));
      if (cmd && !perPath && items.every((c) => c.whole)) { lines.push(cmd); continue; }
      for (const c of items) {
        const parent = c.path.slice(0, c.path.lastIndexOf("/")) || "/";
        lines.push((perPath && c.whole ? cmd.replaceAll("{path}", shq(c.path)).replaceAll("{parent}", shq(parent)) : "rm -rf -- " + shq(c.path)) + "   # " + fmt(c.size));
      }
    }
  }
  return lines.join("\n") + "\n";
}
$("#selSafe").onclick = () => { selected = defaultSel(); changed(); };
$("#selNone").onclick = () => { selected = new Set(); changed(); };
$("#preview").onclick = () => {
  const box = $("#scriptBox"), on = box.style.display !== "block";
  box.style.display = on ? "block" : "none";
  $("#preview").textContent = on ? "Hide" : "Preview";
  if (on) $("#scriptPre").textContent = buildScript();
};
$("#copy").onclick = async () => {
  const text = buildScript(), btn = $("#copy");
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = el("textarea"); ta.value = text; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  btn.textContent = "Copied ✓"; setTimeout(() => (btn.textContent = "Copy script"), 1500);
};
$("#download").onclick = () => {
  const a = el("a"); a.href = URL.createObjectURL(new Blob([buildScript()], { type: "text/x-sh" }));
  a.download = "cleanup.sh"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

renderCards(); renderLegend(); renderRecs(); renderFoot(); renderMap();
</script>
</body>
</html>
